<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal-Prep & Gewichtstracker</title>
  <style>
    :root {
      --bg: #121814;
      --card: #1e2620;
      --accent: #2e7d32;
      --accent-hover: #388e3c;
      --text: #e8f5e9;
      --text-sub: #a5d6a7;
      --border: #2c3b2e;
      --danger: #c62828;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1, h2, h3 { color: var(--text); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    details summary {
      cursor: pointer;
      font-weight: bold;
      color: var(--text-sub);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
    input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      padding: 8px;
      background: #141a15;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover { background: var(--accent-hover); }
    .status { margin-top: 10px; font-size: 0.9rem; font-weight: bold; }
    .status.ok { color: #81c784; }
    .status.err { color: #e57373; }
    .status.sync { color: #64b5f6; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Meal-Prep & Gewichtstracker</h1>

    <!-- SECTION: GITLAB SETTINGS -->
    <div class="card">
      <details id="sync-details">
        <summary>▼ Gemeinsam speichern über GitLab <span id="sync-badge" class="status"></span></summary>
        <p style="font-size: 0.9rem; color: var(--text-sub);">
          Speichert alle Daten privat in eurem GitLab-Projekt. Die Seite führt Änderungen vor dem Speichern automatisch zusammen, um Datenverlust zu verhindern.
        </p>
        <div class="grid">
          <div>
            <label>GitLab-Adresse</label>
            <input type="text" id="cfg-url" value="https://gitlab.com">
          </div>
          <div>
            <label>Projektpfad (username/projekt)</label>
            <input type="text" id="cfg-path" placeholder="z. B. naeherdran/kochbuch">
          </div>
          <div>
            <label>Branch</label>
            <input type="text" id="cfg-branch" value="main">
          </div>
          <div>
            <label>Access Token (Scope: api)</label>
            <input type="password" id="cfg-token" placeholder="glpat-...">
          </div>
        </div>
        <button onclick="connectGitLab()">Verbinden</button>
        <div id="sync-status" class="status"></div>
      </details>
    </div>

    <!-- SECTION: TRACKER & MEAL PREP -->
    <div class="card">
      <h2>Euer Tracker</h2>
      <div class="grid">
        <div>
          <label>Gewicht (kg)</label>
          <input type="number" step="0.1" id="input-weight" placeholder="70.5">
          <button onclick="addWeight()">Eintragen</button>
        </div>
        <div>
          <label>Notiz / Gericht</label>
          <input type="text" id="input-note" placeholder="z. B. Wochenkarte gekocht">
          <button onclick="addNote()">Hinzufügen</button>
        </div>
      </div>
    </div>

    <!-- SECTION: DATA DISPLAY -->
    <div class="card">
      <h3>Gespeicherte Daten</h3>
      <h4>Gewichtsverlauf</h4>
      <ul id="list-weights"></ul>
      <h4>Notizen & Aktivitäten</h4>
      <ul id="list-notes"></ul>
    </div>
  </div>

  <script>
    // App State
    let appData = {
      weights: [],
      notes: [],
      updatedAt: 0
    };

    // Load credentials from localStorage
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('cfg-url').value = localStorage.getItem('gl_url') || 'https://gitlab.com';
      document.getElementById('cfg-path').value = localStorage.getItem('gl_path') || '';
      document.getElementById('cfg-branch').value = localStorage.getItem('gl_branch') || 'main';
      document.getElementById('cfg-token').value = localStorage.getItem('gl_token') || '';

      if (localStorage.getItem('gl_token') && localStorage.getItem('gl_path')) {
        syncFromGitLab();
      }
    });

    function getSyncConfig() {
      return {
        url: document.getElementById('cfg-url').value.trim().replace(/\/$/, ''),
        path: encodeURIComponent(document.getElementById('cfg-path').value.trim()),
        branch: document.getElementById('cfg-branch').value.trim() || 'main',
        token: document.getElementById('cfg-token').value.trim()
      };
    }

    function connectGitLab() {
      const cfg = getSyncConfig();
      localStorage.setItem('gl_url', cfg.url);
      localStorage.setItem('gl_path', document.getElementById('cfg-path').value.trim());
      localStorage.setItem('gl_branch', cfg.branch);
      localStorage.setItem('gl_token', cfg.token);

      syncFromGitLab();
    }

    function setStatus(msg, type) {
      const el = document.getElementById('sync-status');
      const badge = document.getElementById('sync-badge');
      el.className = 'status ' + type;
      el.innerText = msg;
      if (type === 'ok') {
        badge.innerText = '● Verbunden';
        badge.className = 'status ok';
      } else if (type === 'err') {
        badge.innerText = '● Fehler';
        badge.className = 'status err';
      } else {
        badge.innerText = '● Synchronisiere...';
        badge.className = 'status sync';
      }
    }

    // --- FETCH & MERGE LOGIC (Möglichkeit 1) ---

    async function syncFromGitLab() {
      const cfg = getSyncConfig();
      if (!cfg.token || !cfg.path) return;

      setStatus('Lade Daten von GitLab...', 'sync');
      try {
        const res = await fetch(`${cfg.url}/api/v4/projects/${cfg.path}/repository/files/data.json?ref=${cfg.branch}`, {
          headers: { 'PRIVATE-TOKEN': cfg.token }
        });

        if (res.ok) {
          const fileData = await res.json();
          const remoteContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
          appData = mergeData(appData, remoteContent);
          renderUI();
          setStatus('Mit GitLab synchronisiert', 'ok');
        } else if (res.status === 404) {
          // File doesn't exist yet, create initial
          await saveToGitLab();
        } else {
          setStatus('Fehler beim Laden. Bitte Token/Pfad prüfen.', 'err');
        }
      } catch (err) {
        console.error(err);
        setStatus('Netzwerkfehler beim Laden von GitLab.', 'err');
      }
    }

    async function saveToGitLab() {
      const cfg = getSyncConfig();
      if (!cfg.token || !cfg.path) {
        setStatus('Nicht mit GitLab verbunden (Daten nur lokal).', 'err');
        return;
      }

      setStatus('Prüfe auf neuere Daten vor dem Speichern...', 'sync');
      try {
        // 1. Fetch latest version from GitLab to prevent overwriting
        const getRes = await fetch(`${cfg.url}/api/v4/projects/${cfg.path}/repository/files/data.json?ref=${cfg.branch}`, {
          headers: { 'PRIVATE-TOKEN': cfg.token }
        });

        if (getRes.ok) {
          const fileData = await getRes.json();
          const remoteContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
          // Merge local & remote
          appData = mergeData(remoteContent, appData);
        }

        appData.updatedAt = Date.now();
        const jsonString = JSON.stringify(appData, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

        // 2. Commit back to GitLab
        const payload = {
          branch: cfg.branch,
          commit_message: 'Update data.json via Web App (Auto-Merge)',
          content: encodedContent,
          encoding: 'base64'
        };

        // Try PUT (update), if 404 try POST (create)
        let putRes = await fetch(`${cfg.url}/api/v4/projects/${cfg.path}/repository/files/data.json`, {
          method: 'PUT',
          headers: {
            'PRIVATE-TOKEN': cfg.token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (putRes.status === 404) {
          putRes = await fetch(`${cfg.url}/api/v4/projects/${cfg.path}/repository/files/data.json`, {
            method: 'POST',
            headers: {
              'PRIVATE-TOKEN': cfg.token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });
        }

        if (putRes.ok) {
          renderUI();
          setStatus('Gespeichert in GitLab um ' + new Date().toLocaleTimeString(), 'ok');
        } else {
          setStatus('Fehler beim Speichern in GitLab.', 'err');
        }
      } catch (err) {
        console.error(err);
        setStatus('Netzwerkfehler beim Speichern.', 'err');
      }
    }

    // Smart merge arrays based on unique timestamp/id
    function mergeData(local, remote) {
      const mergedWeights = [...(local.weights || [])];
      (remote.weights || []).forEach(rItem => {
        if (!mergedWeights.some(lItem => lItem.timestamp === rItem.timestamp)) {
          mergedWeights.push(rItem);
        }
      });
      mergedWeights.sort((a, b) => b.timestamp - a.timestamp);

      const mergedNotes = [...(local.notes || [])];
      (remote.notes || []).forEach(rItem => {
        if (!mergedNotes.some(lItem => lItem.timestamp === rItem.timestamp)) {
          mergedNotes.push(rItem);
        }
      });
      mergedNotes.sort((a, b) => b.timestamp - a.timestamp);

      return {
        weights: mergedWeights,
        notes: mergedNotes,
        updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0)
      };
    }

    // UI Logic
    function addWeight() {
      const input = document.getElementById('input-weight');
      const val = parseFloat(input.value);
      if (isNaN(val)) return;

      appData.weights.unshift({
        value: val,
        timestamp: Date.now(),
        dateStr: new Date().toLocaleDateString('de-DE')
      });

      input.value = '';
      renderUI();
      saveToGitLab();
    }

    function addNote() {
      const input = document.getElementById('input-note');
      const text = input.value.trim();
      if (!text) return;

      appData.notes.unshift({
        text: text,
        timestamp: Date.now(),
        dateStr: new Date().toLocaleDateString('de-DE')
      });

      input.value = '';
      renderUI();
      saveToGitLab();
    }

    function renderUI() {
      const wList = document.getElementById('list-weights');
      wList.innerHTML = appData.weights.length ? '' : '<li><em>Noch keine Gewichte eingetragen.</em></li>';
      appData.weights.forEach(w => {
        const li = document.createElement('li');
        li.innerText = `${w.dateStr}: ${w.value} kg`;
        wList.appendChild(li);
      });

      const nList = document.getElementById('list-notes');
      nList.innerHTML = appData.notes.length ? '' : '<li><em>Noch keine Notizen vorhanden.</em></li>';
      appData.notes.forEach(n => {
        const li = document.createElement('li');
        li.innerText = `${n.dateStr}: ${n.text}`;
        nList.appendChild(li);
      });
    }

    // Auto sync in background every 60 seconds
    setInterval(() => {
      if (localStorage.getItem('gl_token')) {
        syncFromGitLab();
      }
    }, 60000);
  </script>
</body>
</html>
